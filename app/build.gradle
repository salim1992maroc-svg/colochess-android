plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ctrange.colochess'
    compileSdk 33

    defaultConfig {
        applicationId "com.ctrange.colochess"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "2.0"

        // Set COLOC_API_BASE_URL in ~/.gradle/gradle.properties or pass -PCOLOC_API_BASE_URL=...
        // Keep the default as a placeholder so production URLs are never hard-coded in source.
        buildConfigField "String", "API_BASE_URL", "\"" + (project.findProperty("COLOC_API_BASE_URL") ?: "https://colochess-backend.malakmalki125.workers.dev/") + "\""
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
    ndkVersion '25.1.8937393'



}

dependencies {

    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'com.google.firebase:firebase-firestore:24.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.MonsterTechnoGits:WebViewAdblock:1.1'


    //checkRoot
    implementation 'com.scottyab:rootbeer-lib:0.1.0'

    //volley
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10'

    def lottieVersion = "3.4.0"

    //noinspection GradleDependency
    implementation "com.airbnb.android:lottie:$lottieVersion"

    implementation 'com.github.bumptech.glide:glide:4.14.2'
    implementation 'com.github.amitshekhariitbhu.Fast-Android-Networking:android-networking:1.0.4'

    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.android.volley:volley:1.2.1'


    implementation 'com.ironsource.sdk:mediationsdk:7.2.6'
    implementation 'androidx.multidex:multidex:2.0.1'

    // update app
    implementation 'com.google.android.play:core:1.10.3'

    // TApJoy
    implementation 'com.tapjoy:tapjoy-android-sdk:12.11.0'
    // implementation files('libs/tapjoyconnectlibrary.jar')


    // Gamify Space (new OkSpin/GSpace SDK)
    implementation 'com.gamify:space:3.4.5'


    // Sweetalert
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
}